name: RoshUP Mobile Builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.roshabbhandari .

      - name: Get packages
        run: flutter pub get

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          path.write_text(text)
          PY

      - name: Analyze mobile code
        run: flutter analyze --no-fatal-infos lib test

      - name: Build RoshUP APK
        run: flutter build apk --release --target lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roshup-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: Build iOS App Bundle
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.roshabbhandari .

      - name: Get packages
        run: flutter pub get

      - name: Analyze mobile code
        run: flutter analyze --no-fatal-infos lib test

      - name: Build RoshUP iOS simulator app
        run: flutter build ios --release --simulator --target lib/main.dart

      - name: Package iOS simulator app
        run: |
          mkdir -p ../artifacts/ios
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app ../artifacts/ios/RoshUP-Simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: roshup-ios-simulator
          path: mobile/artifacts/ios/RoshUP-Simulator.zip
