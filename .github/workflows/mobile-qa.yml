name: Roshab Tasks Mobile QA

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-qa.yml'
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshab.bhandari .
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
