name: Roshab Tasks Mobile Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshab.bhandari .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS Build / TestFlight Preparation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.roshab.bhandari .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app /tmp/roshab-tasks-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-ios-unsigned
          path: /tmp/roshab-tasks-ios-unsigned.zip

  signed_android:
    name: Signed Android APK
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshab.bhandari .
      - run: flutter pub get
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > /tmp/roshab-release.keystore
      - name: Build release APK
        run: flutter build apk --release
      - name: Sign APK with release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" sign --ks /tmp/roshab-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out build/app/outputs/flutter-apk/RoshabTasks-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/RoshabTasks-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-android-signed-apk
          path: mobile/build/app/outputs/flutter-apk/RoshabTasks-release.apk

  testflight:
    name: Signed iOS TestFlight
    if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.roshab.bhandari .
      - run: flutter pub get
      - name: Install signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/ios-signing.p12
          security create-keychain -p buildpass /tmp/build.keychain-db
          security default-keychain -s /tmp/build.keychain-db
          security unlock-keychain -p buildpass /tmp/build.keychain-db
          security import /tmp/ios-signing.p12 -k /tmp/build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpass /tmp/build.keychain-db
      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/roshab_tasks.mobileprovision
      - name: Build signed IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
