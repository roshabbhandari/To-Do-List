name: RoshUP Mobile Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'

jobs:
  android:
    name: RoshUP Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshabbhandari .
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
        working-directory: .
      - run: magick assets/roshup_icon.svg assets/generated_icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter build apk --release --target lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: roshup-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: RoshUP iOS Simulator Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.roshabbhandari .
      - run: brew install imagemagick || true
        working-directory: .
      - run: magick assets/roshup_icon.svg assets/generated_icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter build ios --debug --simulator --target lib/main.dart
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app /tmp/roshup-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshup-ios-simulator
          path: /tmp/roshup-ios-simulator.zip

  signed_android:
    name: Signed RoshUP Android APK
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshabbhandari .
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
        working-directory: .
      - run: magick assets/roshup_icon.svg assets/generated_icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > /tmp/roshup-release.keystore
      - run: flutter build apk --release --target lib/main.dart
      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" sign --ks /tmp/roshup-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out build/app/outputs/flutter-apk/RoshUP-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/RoshUP-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: roshup-android-signed-apk
          path: mobile/build/app/outputs/flutter-apk/RoshUP-release.apk

  testflight:
    name: Signed RoshUP TestFlight
    if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_NAME != '' && secrets.IOS_TEAM_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.roshabbhandari .
      - run: brew install imagemagick || true
        working-directory: .
      - run: magick assets/roshup_icon.svg assets/generated_icon.png
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - name: Install signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/ios-signing.p12
          security create-keychain -p buildpass /tmp/build.keychain-db
          security default-keychain -s /tmp/build.keychain-db
          security unlock-keychain -p buildpass /tmp/build.keychain-db
          security import /tmp/ios-signing.p12 -k /tmp/build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpass /tmp/build.keychain-db
      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/roshup.mobileprovision
      - name: Create export options
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>com.roshabbhandari.roshup</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
      - run: flutter build ipa --release --target lib/main.dart --export-options-plist=ios/ExportOptions.plist
      - name: Prepare App Store Connect API key
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
      - name: Upload IPA to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: roshup-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
