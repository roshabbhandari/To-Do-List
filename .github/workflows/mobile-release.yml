name: Roshab Tasks Mobile Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=android --org com.roshab.bhandari .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS Build / TestFlight Preparation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=ios --org com.roshab.bhandari .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build unsigned iOS app for verification
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app /tmp/roshab-tasks-ios-unsigned.zip
      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-ios-unsigned
          path: /tmp/roshab-tasks-ios-unsigned.zip

  signed_android:
    name: Signed Android APK
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.roshab.bhandari .
      - run: flutter pub get
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/app/roshab-release.keystore
      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=roshab-release.keystore\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build signed APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-android-signed-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  testflight:
    name: Signed iOS TestFlight
    if: ${{ secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.roshab.bhandari .
      - run: flutter pub get
      - name: Prepare App Store Connect API key
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
      - name: Build signed IPA
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: flutter build ipa --release
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: roshab-tasks-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
